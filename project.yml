# Source de vérité du projet Xcode (XcodeGen). Le .xcodeproj n'est pas versionné.
# Génération : `xcodegen generate` (fait automatiquement par la CI).
name: TelegramAccess

options:
  bundleIdPrefix: com.nael
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr
  xcodeVersion: "26.6"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Vérification complète des accès concurrents (avertissements en mode Swift 5).
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    # Tag 1.5.2-tdlib-1.8.69-fb464979 (TDLib 1.8.69). Épinglé par commit.
    revision: 4d4d70eb0a4e6d7ae76d8a009912dc1ee9d1e2c2

targets:
  TelegramAccess:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # iPhone uniquement. Doit être au niveau de la cible : le preset iOS
        # de XcodeGen y impose "1,2", ce qui écraserait un réglage projet.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signature automatique gérée par Apple, réglée par release.yml au moment de l'archive.
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - package: TDLibKit

  TelegramAccessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nael.telegramaccess.tests
    dependencies:
      - target: TelegramAccess

  TelegramAccessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nael.telegramaccess.uitests
        TEST_TARGET_NAME: TelegramAccess
    dependencies:
      - target: TelegramAccess

schemes:
  TelegramAccess:
    build:
      targets:
        TelegramAccess: all
        TelegramAccessTests: [test]
        TelegramAccessUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TelegramAccessTests
        - TelegramAccessUITests
    archive:
      config: Release

  TelegramAccessUnit:
    build:
      targets:
        TelegramAccess: all
        TelegramAccessTests: [test]
    test:
      config: Debug
      targets:
        - TelegramAccessTests
