name: Initialisation des certificats (match)

# À lancer manuellement une seule fois (puis à l'expiration des certificats).
# Nécessite un jeton MATCH_GIT_BASIC_AUTHORIZATION avec droit d'écriture
# sur le dépôt telegram-access-certs ; repasser ensuite à un jeton en lecture seule.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: macos-26
    environment: release
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: match appstore
        run: bundle exec fastlane certs_init
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
