name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build et tests (simulateur)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Tests UI (audits d'accessibilité) uniquement sur les PR, pour économiser les minutes macOS.
      SCHEME: ${{ github.event_name == 'pull_request' && 'TelegramAccess' || 'TelegramAccessUnit' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Cache des paquets Swift (TDLib ~300 Mo)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project TelegramAccess.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath build/TestResults.xcresult \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Résultats de tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: build/TestResults.xcresult
          retention-days: 7
