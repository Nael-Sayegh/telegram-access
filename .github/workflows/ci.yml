name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      ui_tests:
        description: "Inclure les tests UI (audits d'accessibilité)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build et tests (simulateur)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Tests UI (audits d'accessibilité) sur les PR et les lancements manuels
      # (onglet Actions → CI → Run workflow, case « tests UI » cochée par défaut) ;
      # tests unitaires seuls sur les push et les lancements manuels sans la case,
      # pour économiser les minutes macOS.
      SCHEME: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.ui_tests)) && 'TelegramAccessUnit' || 'TelegramAccess' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version et empreinte SHA-256 épinglées (pas de `brew install` non figé).
      # Mise à jour : nouvelle version + empreinte de xcodegen.zip (champ « digest » de la release).
      - name: Installer XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"

      - name: Générer le projet Xcode
        run: '"$RUNNER_TEMP/xcodegen/bin/xcodegen" generate'

      - name: Cache des paquets Swift (TDLib ~300 Mo)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # Au démarrage du runner, les simulateurs iOS sont parfois montés avec retard :
      # xcodebuild n'en trouve alors aucun et échoue sans compiler (vu le 2026-11-11).
      # On attend qu'un iPhone soit disponible (iPhone 17 de préférence), 5 minutes au plus.
      - name: Attendre un simulateur iPhone
        run: |
          set -euo pipefail
          udid=""
          for attempt in $(seq 1 30); do
            udid=$(xcrun simctl list --json devices available | jq -r '
              [.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                | select(.name | startswith("iPhone"))]
              | (map(select(.name == "iPhone 17")) + .) | .[0].udid // empty' || true)
            if [ -n "$udid" ]; then break; fi
            echo "Aucun simulateur iPhone disponible (essai $attempt/30), nouvel essai dans 10 s."
            sleep 10
          done
          if [ -z "$udid" ]; then
            xcrun simctl list
            echo "::error::Aucun simulateur iPhone disponible sur le runner."
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project TelegramAccess.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath build/TestResults.xcresult \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Résultats de tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: build/TestResults.xcresult
          retention-days: 7
